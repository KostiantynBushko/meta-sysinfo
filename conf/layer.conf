# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sysinfo"
BBFILE_PATTERN_meta-sysinfo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sysinfo = "8"

LAYERDEPENDS_meta-sysinfo = "core"
LAYERSERIES_COMPAT_meta-sysinfo = "scarthgap"
